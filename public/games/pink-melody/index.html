<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pink Melody Idol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#FFE3EF; --ground2:#F6DCFF; --card:#FFF8FC; --ink:#4A1540; --ink-soft:#7D4A72;
  --pink:#FF5FA8; --pink-soft:#FFB8D6; --lilac:#B592FF; --gold:#FFC53D; --mint:#7FE3C8;
  --line:#F7C3DC;
  --display:"Mochiy Pop One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,var(--ground) 0%,var(--ground2) 100%) fixed;background-color:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.layout{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 360px}.lyrics{order:2}}

/* lyrics side panel */
.lyrics{align-self:start;background:var(--card);border:2px solid var(--line);border-radius:28px;box-shadow:0 10px 30px rgba(181,146,255,.18);overflow:hidden}
@media (min-width:980px){.lyrics{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);display:flex;flex-direction:column}}
.lyrics summary{list-style:none;cursor:pointer;padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#FFE3F0,#EEE2FF)}
.lyrics summary::-webkit-details-marker{display:none}
.lyrics summary h2{font-size:20px;margin:0;color:var(--pink)}
.lyrics summary .hint{font:800 12px/1 var(--body);color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.lyrics[open] summary .hint{display:none}
.lyr-body{padding:12px 18px 20px;overflow:auto;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{font:800 12.5px/1.1 var(--body);border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.tab.live::after{content:" 🎤"}
.tab:focus-visible,.play:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.song-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.song-title{font-family:var(--display);font-size:20px;line-height:1.2;margin:0;color:var(--ink);text-wrap:balance}
.song-meta{font:700 13px/1.4 var(--body);color:var(--ink-soft);margin:2px 0 0}
.play{flex:none;font:800 13px/1 var(--body);border:0;background:var(--lilac);color:#fff;border-radius:999px;padding:9px 12px;cursor:pointer}
.play.on{background:var(--pink)}
.now{display:inline-block;font:800 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;background:#FFF1C9;color:#8A5A00;border-radius:999px;padding:6px 9px;margin:8px 0 4px}
.sec{margin-top:14px;padding:10px 12px;border-radius:16px;transition:background .3s}
.sec h4{margin:0 0 4px;font:800 11.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--lilac)}
.sec p{margin:0;font-size:15.5px;line-height:1.65}
.sec.hl{background:linear-gradient(135deg,#FFE3F0,#F1E6FF);box-shadow:inset 0 0 0 2px var(--pink-soft)}
.sec.hl h4::after{content:"  ← singing now ✨";color:var(--pink)}
.credit{margin-top:16px;font-size:12.5px;color:var(--ink-soft)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--display);font-size:clamp(20px,5vw,28px);line-height:1.15;color:var(--pink);text-shadow:0 2px 0 #fff,0 0 18px rgba(255,95,168,.35);text-wrap:balance;margin:0}
.brand small{display:block;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-shadow:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:800 13px/1 var(--body);border:2px solid var(--pink-soft);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer}
.pill:hover{border-color:var(--pink)}
.pill:focus-visible,.choice:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.trophies{font-weight:800;font-size:13px;color:var(--ink-soft)}

.turn{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:22px clamp(16px,4vw,30px);margin-bottom:22px;box-shadow:0 10px 30px rgba(255,95,168,.14);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.turn.past{opacity:.72;box-shadow:none}
@keyframes pop{from{transform:translateY(14px) scale(.98)}to{transform:none}}
.eyebrow{font:800 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin:0 0 8px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,5.4vw,30px);line-height:1.2;margin:0 0 14px;text-wrap:balance;color:var(--ink)}
.turn p{margin:0 0 12px;max-width:62ch}
.chant{font-family:var(--display);color:var(--pink);font-size:1.08em;letter-spacing:.02em}
.count{font-family:var(--display);font-size:1.25em;color:var(--lilac)}
.divider{text-align:center;letter-spacing:.3em;margin:16px 0;font-size:18px}

.reaction{background:linear-gradient(135deg,#FFF0F7,#F3EAFF);border-radius:20px;padding:16px 18px;margin-bottom:18px;border:2px dashed var(--pink-soft)}
.reaction .eyebrow{color:var(--lilac)}
.deltas{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.delta{font:800 14px/1 var(--body);padding:8px 12px;border-radius:999px;background:#fff;border:2px solid var(--mint);color:#1F6B57}
.delta.down{border-color:#FFB3B3;color:#9B2C2C}

.status{margin:18px 0;border-radius:22px;padding:16px 18px;background:#fff;border:3px solid var(--pink-soft);position:relative}
.status h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 10px;text-align:center;color:var(--pink)}
.stat{display:grid;grid-template-columns:minmax(128px,auto) 1fr auto;align-items:center;gap:6px 12px;padding:6px 0;border-top:1px dashed var(--line)}
.stat:first-of-type{border-top:0}
.stat .name{font-weight:800}
.stat .bar{font-size:20px;letter-spacing:2px;white-space:nowrap}
.stat .lvl{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:14px;white-space:nowrap}
.stat .lvl.max{color:#B8860B}
@media (max-width:480px){.stat{grid-template-columns:1fr auto}.stat .bar{grid-column:1 / -1;grid-row:2}}

.ask{font-family:var(--display);text-align:center;font-size:20px;color:var(--pink);margin:22px 0 12px}
.choices{display:grid;gap:12px}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:3px solid var(--pink-soft);background:linear-gradient(135deg,#fff,#FFF2F8);color:var(--ink);border-radius:22px;padding:14px 16px;cursor:pointer;font:600 16px/1.45 var(--body);transition:transform .15s,border-color .15s,box-shadow .15s}
.choice:hover:not([disabled]){transform:translateY(-2px) rotate(-.3deg);border-color:var(--pink);box-shadow:0 8px 20px rgba(255,95,168,.25)}
.choice .n{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;font:400 16px/1 var(--display)}
.choice b{display:block;font:400 16px/1.3 var(--display);color:var(--pink);margin-bottom:3px}
.choice[disabled]{cursor:default;opacity:.5}
.choice.picked{opacity:1;border-color:var(--pink);background:linear-gradient(135deg,#FFE0EE,#EFE3FF)}
.choice.picked .n{background:var(--lilac)}

.curtain{position:fixed;top:0;bottom:0;width:51%;z-index:5;pointer-events:none;background:repeating-linear-gradient(90deg,#E23E88 0 26px,#FF5FA8 26px 52px);box-shadow:inset 0 -40px 60px rgba(74,21,64,.35)}
.curtain.l{left:0;animation:openL 1.6s 1.1s cubic-bezier(.7,0,.3,1) forwards}
.curtain.r{right:0;animation:openR 1.6s 1.1s cubic-bezier(.7,0,.3,1) forwards}
@keyframes openL{to{transform:translateX(-102%)}}
@keyframes openR{to{transform:translateX(102%)}}
@media (prefers-reduced-motion:reduce){.curtain{display:none}.turn{animation:none}.choice{transition:none}}
</style>
</head>
<body>

<div class="curtain l" aria-hidden="true"></div>
<div class="curtain r" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="top">
    <h1 class="brand"><small>🎤 An idol stage adventure 🎀</small>Pink Melody ✨</h1>
    <div class="tools">
      <span class="trophies" id="trophies"></span>
      <button class="pill" id="sound" type="button">🔊 Sound on</button>
      <button class="pill" id="restart" type="button">🌸 Restart</button>
    </div>
  </header>
  <div class="layout">
    <details class="lyrics" id="lyrics">
      <summary><h2>🎵 Setlist &amp; Lyrics 🎵</h2><span class="hint">Tap to open 💖</span></summary>
      <div class="lyr-body">
        <div class="tabs" id="tabs" role="tablist" aria-label="Songs"></div>
        <div id="song"></div>
        <p class="credit">🌸 All songs written for Pink Melody. Sing along when a section lights up! 🎤</p>
      </div>
    </details>
    <main id="story" aria-live="polite"></main>
  </div>
</div>

<script>
(function(){
const START = {v:2, sp:3, h:2};
const VENUES = [
  "🍓🎵 STRAWBERRY SYMPHONY STADIUM 🎵🍓",
  "🍭💫 COTTON CANDY DOME 💫🍭",
  "🌸🌙 STARLIGHT SAKURA ARENA 🌙🌸",
  "🌈💎 RAINBOW PEARL COLISEUM 💎🌈"
];
const NAMES = {v:"🎤 Vocal Power", sp:"💖 Idol Sparkle", h:"🎀 Fan Hype"};
const ICON = {v:["💗","🤍"], sp:["💖","🤍"], h:["🎀","🤍"]};
const SUFFIX = {v:"💗", sp:"✨", h:"🌸"};
const MAX = 5;

let S, history, trophies = [];

function fresh(tour){
  return {...START, tour: tour||0, flags:{}};
}

/* ---------- SCENES ---------- */
const SC = {
open:{
  eyebrow:"Backstage · Tour stop", title:"✨ 30 Seconds to Showtime ✨",
  text:s=>[
    `You're standing backstage at the enormous <b>${VENUES[s.tour%VENUES.length]}</b>! 🎤💖`,
    `The bass vibrates up through the floor and into your sparkling shoes. 🎵 Pink and purple lights glow underneath the stage like a sleepy sunrise. 💜🩷`,
    `Your custom idol outfit catches every beam 🎀 — matching pink ribbons, shimmering gems 💎, tiny flowers 🌸, and glitter that twinkles each time you breathe. ✨`,
    `The air smells of fresh flowers and stage fog. 🌷💨 Outside the curtains, thousands of fans are chanting your name:`,
    `<span class="chant">"WE LOVE YOU! 💖🎤 WE LOVE YOU! 💖🎤"</span>`,
    `A sea of pink lightsticks sparkles like glowing stars. ✨🩷✨🩷✨ Your heart beats faster… 💕`,
    `The stage manager leans in and whispers: <i>"You're on in 30 seconds…"</i> 🎤✨`,
    `The crowd gets louder. <span class="count">"10… 9… 8…"</span>`,
    `You take a deep breath. The magical microphone in your hand pulses in time with the music and glows brighter… 💫`,
    `The curtains begin to open…`,
    `<div class="divider">✨🎀🌸💖🎤🎵🌸🎀✨</div>`
  ],
  choices:[
    {icon:"🎤", name:"POWER NOTE", desc:"Step onto the stage and open the concert with an enormous, powerful high note.",
     fx:{v:2}, set:{entrance:"power"}, next:"song1",
     result:s=>[`You stride into the spotlight and let loose a HUGE high note! 🎤💥`,
       `It soars all the way to the stadium roof. The screens shake. The fans scream so loud the confetti launches itself! 🎊`,
       `<span class="chant">"SHE HIT THE WHISTLE NOTE!!" 😱💗</span>`]},
    {icon:"🎀", name:"SPARKLE ENTRANCE", desc:"Walk onto the stage slowly while performing a dazzling choreography entrance.",
     fx:{sp:2}, set:{entrance:"sparkle"}, next:"song1",
     result:s=>[`You glide out step by step, ribbons twirling, arms tracing hearts in the air. 🎀💃`,
       `Every spotlight follows you. Your outfit bursts into rainbow glimmers! 🌈✨`,
       `The crowd gasps in one giant <span class="chant">"WAAAAH~! 😍"</span> and ten thousand phones light up to film you. 📱💖`]},
    {icon:"💖", name:"HEARTFELT START", desc:"Hold the microphone close and begin with a soft, emotional melody that makes the entire stadium go silent.",
     fx:{h:2, v:1}, set:{entrance:"heart"}, next:"song1",
     result:s=>[`You hold the mic close and sing, soft and warm. 🎶💖`,
       `The whole stadium goes silent. Lightsticks sway slowly like fireflies. ✨🩷`,
       `In the front row, someone whispers <i>"I'm crying already…" 🥹</i> Then the cheers crash in like a wave! 🌊💕`]}
  ]
},
song1:{
  eyebrow:"Song 1 · Opening number", title:"🍓 Strawberry Starlight 🍓",
  text:s=>[
    s.flags.entrance==="power" ? `The band roars in right after your high note! 🥁🎸 The drummer gives you a thumbs-up. 👍✨`
    : s.flags.entrance==="sparkle" ? `The band kicks in, perfectly timed to your final entrance pose. 🥁🎸 Glitter is still drifting down! ✨`
    : `The band gently joins your melody, then BOOM, the beat drops! 🥁🎸 The crowd leaps to its feet! 🎉`,
    `It's your hit single, <b>"Strawberry Starlight"</b>! 🍓⭐️ The chorus is coming up fast.`,
    `The giant screens show your face 50 feet tall. You've got one chorus to make this opening legendary. 🎤👑`
  ],
  choices:[
    {icon:"🎤", name:"KEY CHANGE CHALLENGE", desc:"Push the final chorus up a whole key and belt it with everything you've got.",
     fx:{v:2}, next:"surprise",
     result:s=>[`The music lifts… and so do you! 🎶⬆️ Your voice rings out clear and sparkly-strong. 🎤💎`,
       `The band members look at each other like <i>"did that just happen?!"</i> 😲 The fans go WILD! 💖`]},
    {icon:"🎀", name:"LIGHTSTICK WAVE", desc:"Teach the whole stadium a lightstick wave, section by section.",
     fx:{h:2, sp:1}, next:"surprise",
     result:s=>[`"Left side! 💖 Right side! 💜 Everybody!!" 🎀`,
       `A giant wave of pink light rolls around the stadium like the ocean at sunset. 🌊🩷 It's so pretty the camera crew forgets to zoom! 📸✨`]},
    {icon:"✨", name:"GLITTER CANNON SPIN", desc:"Time a spinning jump perfectly with the glitter cannons.",
     fx:{sp:2}, next:"surprise",
     result:s=>[`You spin, jump, and 💥 FWOOSH! The glitter cannons explode right on beat! ✨🎊`,
       `You land in a perfect pose inside a pink sparkle storm. The screens show it in slow motion. 🌸💫`]}
  ]
},
surprise:{
  eyebrow:"Stage surprise!", title:"⚡️ The Microphone Flickers! ⚡️",
  text:s=>[
    `The drums kick off your second song, the fierce dance track <b>"Wild Glitter"</b>! 💎🥁`,
    `Right as you lift the mic for the first line, your magical microphone flickers… and goes quiet. 🎤💤`,
    `The sound crew waves from the side of the stage: <i>"30 seconds to fix it!"</i> ⏱️`,
    `Thousands of fans are watching. This is the moment a true idol shines. 🌟💕`
  ],
  choices:[
    {icon:"🎤", name:"SING WITHOUT A MIC", desc:"Step to the very front and sing out with your natural voice, no mic at all.",
     fx:{v:2, h:1}, set:{mic:"acapella"}, next:"fan",
     result:s=>[`You take a breath and sing with nothing but your own voice. 🎶`,
       `The stadium goes hush-quiet to hear you. Your voice carries all the way to the top seats! 🏟️💗`,
       `When the mic blinks back on, it glows <b>gold</b> for a second, like it's proud of you. 🎤✨`]},
    {icon:"🎀", name:"FAN CHOIR", desc:"Hop to the edge of the stage and let the fans sing the chorus for you.",
     fx:{h:2}, set:{mic:"choir"}, next:"fan",
     result:s=>[`You cup your hand to your ear and point the dead mic at the crowd. 🎀👂`,
       `Tens of thousands of fans sing your chorus back to you, every single word! 🎶💕`,
       `It's so loud and sweet that your eyes sparkle with happy tears. 🥹💖`]},
    {icon:"✨", name:"DANCE BREAK", desc:"Signal the band for an instrumental and fill the time with a surprise dance break.",
     fx:{sp:2}, set:{mic:"dance"}, next:"fan",
     result:s=>[`You flash the band a secret signal. 🤫🎸 The beat switches to a funky instrumental!`,
       `You spin, pop, and slide across the stage in a freestyle dance break. 💃✨`,
       `Nobody even realises something went wrong. They think it's a planned surprise! 😆🌟`]}
  ]
},
fan:{
  eyebrow:"Fan moment", title:"🌷 A Sign in the Front Row 🌷",
  text:s=>[
    `The mic is back and glowing! 🎤💫 As the song ends, you spot a little fan in the front row. 👀`,
    `She's holding a hand-painted sign covered in stickers: <b>"YOUR SONGS GAVE ME COURAGE 💖"</b> 🌸`,
    `She's waving so hard her pigtails are bouncing. 🥰 Her whole family is cheering beside her.`
  ],
  choices:[
    {icon:"🎤", name:"DEDICATE A SONG", desc:"Dedicate your next song to her and sing it looking right at her sign.",
     fx:{h:2, v:1}, set:{fan:"song"}, next:"costume",
     result:s=>[`"This next song is for the girl with the beautiful sign! 💖"`,
       `She covers her face with both hands, then jumps up and down. 🥹🎀 The whole stadium cheers for her!`]},
    {icon:"🎀", name:"GIFT YOUR RIBBON", desc:"Untie one of your pink ribbons and toss it to her with a heart hand.",
     fx:{h:2, sp:1}, set:{fan:"ribbon"}, next:"costume",
     result:s=>[`You untie a ribbon and send it floating down like a pink butterfly. 🎀🦋`,
       `She catches it! 😆 She holds it up high and the camera zooms in. The big screen fills with hearts. 💕💕💕`]},
    {icon:"✨", name:"SIGN SPOTLIGHT", desc:"Ask the lighting crew to shine a sparkly spotlight on her sign for everyone to read.",
     fx:{h:1, sp:2}, set:{fan:"spot"}, next:"costume",
     result:s=>[`"Lights, please! 🔦✨" A pink spotlight finds her sign.`,
       `The whole stadium reads it together and cheers! 🌟 She's glowing like a star herself. 💫`]}
  ]
},
costume:{
  eyebrow:"Quick change · 90 seconds", title:"👗 Backstage Costume Rush 👗",
  text:s=>[
    `You dash backstage for your costume change! 🏃‍♀️💨 Stylists swarm around you with pins, brushes, and sparkles. ✨`,
    `Three outfits wait on the rack, each one glittering under the mirror lights. 💡🪞`,
    `The next part of the show is yours to shape. Which look will you wear? 🎀`
  ],
  choices:[
    {icon:"🎤", name:"STARLIGHT GOWN", desc:"A flowing lavender gown with star-dusted sleeves, made for big ballads.",
     fx:{v:1, sp:1}, set:{outfit:"gown"}, next:"rival",
     result:s=>[`You step out in the <b>Starlight Gown</b>. 🌌💜 Every step leaves a trail of tiny glowing stars.`,
       `The crowd whispers <i>"a princess!!" 👑</i>`]},
    {icon:"🎀", name:"CANDY POP SKIRT", desc:"A bouncy pink-and-mint skirt with bows and light-up sneakers, made for dancing.",
     fx:{sp:2}, set:{outfit:"candy"}, next:"rival",
     result:s=>[`You bounce back on stage in the <b>Candy Pop Skirt</b>! 🍬👟`,
       `Your sneakers flash pink with every step. The fans chant <span class="chant">"CUTE! CUTE! CUTE!" 🥰</span>`]},
    {icon:"✨", name:"FAN-LETTER JACKET", desc:"A rainbow jacket covered in patches made from real fan letters.",
     fx:{h:2}, set:{outfit:"jacket"}, next:"rival",
     result:s=>[`You return wearing the <b>Fan-Letter Jacket</b>! 🌈💌`,
       `When the screen zooms in, fans spot their own words stitched onto it. People are hugging each other in the stands. 🫶💕`]}
  ]
},
rival:{
  eyebrow:"A surprise guest!", title:"🌙 Luna Violet Appears! 🌙",
  text:s=>{
    const o = {gown:"Starlight Gown 🌌", candy:"Candy Pop Skirt 🍬", jacket:"Fan-Letter Jacket 🌈"}[s.flags.outfit];
    return [
    `Just as you strike a pose in your ${o}, the lights turn deep purple. 💜🌫️`,
    `A second stage rises from the fog, and on it stands <b>Luna Violet</b>, the famous "Midnight Moon Idol"! 🌙🎤`,
    `She smiles and points her silver microphone at you. <i>"Let's see who shines brightest tonight, star!"</i> ⭐️`,
    `The crowd splits into pink and purple lightsticks. 🩷💜 This could get exciting!`
  ];},
  choices:[
    {icon:"🎤", name:"HARMONY BATTLE", desc:"Answer her vocal run with a higher, sparklier one of your own.",
     fx:{v:2}, set:{rival:"battle"}, next:"newsong",
     result:s=>[`Luna sings a silky run. 🌙 You answer with a higher one! 🎤 She goes higher. You go HIGHER! ⬆️⬆️`,
       `You finish on a note so bright the lights flicker pink. 💗 Luna laughs and bows: <i>"Okay, okay, you win this round!"</i> 😄`]},
    {icon:"🎀", name:"MAKE IT A DUET", desc:"Offer her your hand and turn the challenge into a surprise duet.",
     fx:{h:1, sp:1, v:1}, set:{rival:"friend"}, next:"newsong",
     result:s=>[`You reach across the stage and offer your hand. 🤝💕 Luna blinks, then smiles and takes it.`,
       `You sing together, pink and purple harmonies swirling. 🩷💜 The lightsticks mix into one glowing lavender sea! 🌊✨`,
       `Backstage later, Luna whispers: <i>"Friends?"</i> 🥰`]},
    {icon:"✨", name:"DANCE-OFF", desc:"Challenge her to a friendly dance-off in the middle of the runway.",
     fx:{sp:2, h:1, v:-1}, set:{rival:"dance"}, next:"newsong",
     result:s=>[`You point to the runway. 💃 Luna grins and accepts!`,
       `Spins, slides, a perfect heart-shaped pose… 💖 The crowd votes with lightsticks, and PINK takes it! 🩷🏆`,

let shownSong = "strawberry", liveSong = null, liveSec = null;
const tabsEl = document.getElementById("tabs"), songEl = document.getElementById("song");
function drawTabs(){
  tabsEl.innerHTML = Object.keys(SONGS).map(k=>
    `<button class="tab ${k===liveSong?"live":""}" role="tab" type="button" id="tab-${k}" aria-selected="${k===shownSong}" data-k="${k}">${SONGS[k].tab}</button>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ shownSong=b.dataset.k; drawTabs(); drawSong(); });
}
function drawSong(){
  const so = SONGS[shownSong];
  const isLive = shownSong===liveSong;
  songEl.innerHTML = `<div class="song-head"><div><h3 class="song-title">${so.title}</h3><p class="song-meta">${so.meta}</p></div>
    <button class="play ${playing===shownSong?"on":""}" id="play" type="button">${playing===shownSong?"⏹ Stop":"▶ Melody"}</button></div>
    ${isLive?`<span class="now">🎤 On stage now</span>`:""}
    ${so.secs.map(([h,lines])=>`<div class="sec ${isLive&&h===liveSec?"hl":""}"><h4>${h}</h4><p>${lines.join("<br>")}</p></div>`).join("")}`;
  document.getElementById("play").onclick = ()=>{ playing===shownSong ? stopTune() : playTune(shownSong); drawSong(); };
}
function setNowPlaying(sceneId){
  let m = NOW[sceneId]; if(typeof m==="function") m = m(S);
  if(m && m[0]){ liveSong=m[0]; liveSec=m[1]; shownSong=m[0]; }
  else { liveSong=null; liveSec=null; }
  drawTabs(); drawSong();
}

  if(reaction){
    html += `<div class="reaction"><p class="eyebrow">💫 The crowd reacts 💫</p>${reaction.paras.map(p=>`<p>${p}</p>`).join("")}`;
    if(reaction.deltas.length) html += `<div class="deltas">${reaction.deltas.map(d=>`<span class="delta ${d.n<0?"down":""}">${NAMES[d.k]} ${d.n>0?"+":""}${d.n}</span>`).join("")}</div>`;
    html += `</div>`;
  }
  const title = typeof sc.title==="function" ? sc.title(S) : sc.title;
  const eyebrow = sceneId==="open" ? `Backstage · Tour stop ${S.tour+1}` : sc.eyebrow;
  html += `<p class="eyebrow">${eyebrow}</p><h2>${title}</h2>`;
  html += sc.text(S).map(p=>p.startsWith("<div")?p:`<p>${p}</p>`).join("");
  html += statusHTML();
  html += `<p class="ask">💕 WHAT WILL YOU DO? 💕</p><div class="choices">`;
  sc.choices.forEach((c,i)=>{
    html += `<button class="choice" type="button" id="c-${history.length}-${i}" data-i="${i}"><span class="n">${i+1}</span><span><b>${c.icon} ${c.name}</b>${c.desc}</span></button>`;
  });
  html += `</div>`;
  el.innerHTML = html;
  el.querySelectorAll(".choice").forEach(btn=>btn.addEventListener("click",()=>{
    choose(sceneId, +btn.dataset.i, el, btn, true);
  }));
  story.appendChild(el);
  setNowPlaying(sceneId);
  return el;
}

function choose(sceneId, i, el, btn, live){
  const c = SC[sceneId].choices[i];
  el.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  btn.classList.add("picked");
  el.classList.add("past");
  history.push([sceneId,i]);
  if(live) jingle(c.icon);

  if(c.special==="restart"){ startNew(S.tour, true); return; }
  if(c.special==="tour"){
    const e = endingOf(S); if(live){ trophies.push(e.badge); renderTrophies(); }
    const t = S.tour+1; S = fresh(t);
    const r = {paras:[`You wave goodbye from the airport with your trophy tucked in your suitcase. ✈️🏆`,`Next stop: <b>${VENUES[t%VENUES.length]}</b>! Every new stage is a fresh start, so your stats reset for tonight's show. 🌸💫`], deltas:[]};
    afterTurn(renderTurn("open", r), live); return;
  }
  if(c.special==="writeback"){
    const r = {paras:[`You write until midnight, decorating every card with ribbon stickers and tiny hand-drawn stars. 🎀⭐️✍️`,`When the cards arrive, fans post them everywhere. <span class="chant">#PinkMelodyWroteBack</span> trends worldwide! 🌍💖`], deltas:[]};
    afterTurn(renderTurn("letters", r), live); return;
  }
  if(sceneId==="ending" && c.special==="letters"){ afterTurn(renderTurn("letters", null), live); return; }

  const deltas = [];
  for(const k in (c.fx||{})){
    const before = S[k]; S[k] = clamp(S[k] + c.fx[k]);
    if(S[k]!==before) deltas.push({k, n:S[k]-before});
    else if(c.fx[k]>0) deltas.push({k, n:0});
  }
  Object.assign(S.flags, c.set||{});
  const r = {paras:c.result(S), deltas:deltas.filter(d=>d.n!==0)};
  if(deltas.some(d=>d.n===0)) r.paras.push(`Your ${deltas.filter(d=>d.n===0).map(d=>NAMES[d.k]).join(" and ")} is already at MAX! 👑✨`);
  afterTurn(renderTurn(c.next, r), live);
}

function afterTurn(el, live){
  if(live) setTimeout(()=>el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}), 60);
}

function startNew(tour, live){
  S = fresh(tour);
  const el = renderTurn("open", live ? {paras:[`✨ Rewind! ✨ You're back backstage, heart pounding, microphone glowing. Let's make tonight completely different! 🌸🎤`], deltas:[]} : null);
  afterTurn(el, live);
}

function boot(data){
  story.innerHTML = "";
  trophies = (data && data.trophies) || [];
  renderTrophies();
  history = [];
  S = fresh((data && data.tour0) || 0);
  const tour0 = S.tour;
  let el = renderTurn("open", null);
  const past = (data && data.history) || [];
  for(const [sid,i] of past){
    const btn = el.querySelector(`.choice[data-i="${i}"]`);
    if(!btn) break;
    choose(sid, i, el, btn, false);
    el = story.lastElementChild;
  }
  window.__tour0 = tour0;
}

document.getElementById("restart").addEventListener("click",()=>{ boot({trophies}); window.scrollTo({top:0}); });

/* ---------- SOUND ---------- */
let soundOn = true, ctx;
const sBtn = document.getElementById("sound");
sBtn.addEventListener("click",()=>{ soundOn=!soundOn; sBtn.textContent = soundOn?"🔊 Sound on":"🔇 Sound off"; });
let playing = null, tuneTimer = null, tuneNodes = [];
function noteHz(n){
  const m = n.match(/^([A-G])(#?)(\d)$/); const idx = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0);
  return 440*Math.pow(2,(idx + (+m[3]+1)*12 - 69)/12);
}
function stopTune(){ clearTimeout(tuneTimer); tuneNodes.forEach(o=>{try{o.stop()}catch(e){}}); tuneNodes=[]; playing=null; }
function playTune(k){
  stopTune();
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    const u = .16; let t = ctx.currentTime + .05;
    SONGS[k].tune.split(" ").forEach(tok=>{
      const [n,d] = tok.split(":"); const dur = (+d)*u;
      const o = ctx.createOscillator(), g = ctx.createGain(), o2 = ctx.createOscillator();
      o.type="triangle"; o2.type="sine"; o.frequency.value = noteHz(n); o2.frequency.value = noteHz(n)*2;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.11,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur*.95);
      o.connect(g); o2.connect(g); g.connect(ctx.destination);
      o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur); tuneNodes.push(o,o2);
      t += dur;
    });
    playing = k;
    tuneTimer = setTimeout(()=>{ playing=null; tuneNodes=[]; drawSong(); }, (t-ctx.currentTime)*1000);
  }catch(e){ playing=null; }
}
function jingle(icon){
  if(!soundOn) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    const base = icon==="🎤"?523.25: icon==="🎀"?587.33:659.25;
    [1,1.25,1.5,2].forEach((m,idx)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = base*m;
      const t = ctx.currentTime + idx*0.09;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.35);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+.4);
    });
  }catch(e){}
}

/* ---------- SPARKLE SKY ---------- */
const cv = document.getElementById("sky"), g2 = cv.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W,H,parts=[];
const GLYPHS = ["💖","✨","🩷","⭐️","🌸","💫","🎵"];
function size(){
  const d = Math.min(devicePixelRatio||1,2);
  W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; g2.setTransform(d,0,0,d,0,0);
  const n = Math.round(Math.min(34, W/28));
  parts = Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,s:12+Math.random()*14,v:.2+Math.random()*.5,w:Math.random()*6.28,gl:GLYPHS[(Math.random()*GLYPHS.length)|0],a:.25+Math.random()*.35}));
}
function draw(t){
  g2.clearRect(0,0,W,H);
  // lightstick sea
  for(let i=0;i<W;i+=22){
    const y = H - 18 - Math.sin(i*.05 + (still?0:t*.002))*6 - (i%44?0:6);
    const grd = g2.createRadialGradient(i,y,0,i,y,12);
    grd.addColorStop(0,"rgba(255,95,168,.55)"); grd.addColorStop(1,"rgba(255,95,168,0)");
    g2.fillStyle = grd; g2.beginPath(); g2.arc(i,y,12,0,6.28); g2.fill();
  }
  // spotlights
  if(!still){
    [[.2,"255,184,214"],[.8,"181,146,255"]].forEach(([px,c],k)=>{
      const ang = Math.sin(t*.0006 + k*2)*.35;
      g2.save(); g2.translate(W*px,0); g2.rotate(ang);
      const lg = g2.createLinearGradient(0,0,0,H);
      lg.addColorStop(0,`rgba(${c},.28)`); lg.addColorStop(1,`rgba(${c},0)`);
      g2.fillStyle = lg; g2.beginPath(); g2.moveTo(-10,0); g2.lineTo(10,0); g2.lineTo(H*.25,H); g2.lineTo(-H*.25,H); g2.closePath(); g2.fill(); g2.restore();
    });
  }
  g2.textAlign="center";
  for(const p of parts){
    if(!still){ p.y -= p.v; p.w += .02; if(p.y < -30){ p.y = H+20; p.x = Math.random()*W; } }
    g2.globalAlpha = p.a; g2.font = `${p.s}px serif`; g2.fillText(p.gl, p.x + Math.sin(p.w)*10, p.y);
  }
  g2.globalAlpha = 1;
  if(!still) requestAnimationFrame(draw);
}
addEventListener("resize", size); size(); requestAnimationFrame(draw);

/* ---------- START (with live-update state carry-over) ---------- */
try{ if(matchMedia("(min-width: 980px)").matches) document.getElementById("lyrics").open = true; }catch(e){}
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(()=>({history, trophies, tour0: window.__tour0||0}));
const start = d => boot(d||{});
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
