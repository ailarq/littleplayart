<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Bestie Buddies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Sniglet:wght@400;800&display=swap">
<style>
/* Layout: one playdate "activity box" column; a sticky candy-stripe top bar holds the friendship meter + sound; screens swap inside. Single pastel world, deliberately light. */
:root{
  --pink:#ffc8dd; --pink-deep:#ff4f9a; --pink-mid:#ff8fc1;
  --lav:#e3d6ff; --lav-deep:#8a5cf0;
  --blue:#cde8ff; --blue-deep:#2f8fe0;
  --yellow:#fff1a8; --yellow-deep:#ffc93c;
  --mint:#c9f5e3; --mint-deep:#1fae78;
  --ink:#4a3560; --ink-soft:#7c6893; --paper:#fffafd; --bg:#fff0f7;
  --display:'Sniglet','Fredoka','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
  --body:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--body);color:var(--ink);font-size:18px;line-height:1.45;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 12px 12px, rgba(255,143,193,.22) 3px, transparent 4px),
    linear-gradient(160deg,#ffe3f0 0%,#efe4ff 45%,#dff0ff 100%);
  background-size:36px 36px,100% 100%;background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--lav-deep);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
.emo{font-family:var(--emoji)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;
  padding:10px 16px;background:
  repeating-linear-gradient(-45deg,rgba(255,255,255,.55) 0 14px,rgba(255,255,255,0) 14px 28px),var(--pink);
  border-bottom:3px solid #fff;box-shadow:0 4px 14px rgba(138,92,240,.15)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;color:var(--pink-deep);white-space:nowrap;
  text-shadow:2px 2px 0 #fff}
.bar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meter{display:flex;gap:2px;align-items:center;background:#fff;border-radius:999px;padding:4px 10px;font-size:20px;
  box-shadow:inset 0 -3px 0 var(--pink)}
.meter .lbl{font-size:13px;font-weight:600;color:var(--ink-soft);margin-right:4px}
.meter span.h{display:inline-block;transition:transform .3s}
.meter span.h.pop{animation:pop .6s}
.pill{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;
  box-shadow:0 3px 0 var(--lav)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lav)}

/* ---------- screens ---------- */
main{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
.screen{animation:screenIn .45s ease both}
.card{background:var(--paper);border-radius:32px;padding:clamp(18px,4vw,34px);
  border:4px solid #fff;box-shadow:0 10px 0 rgba(138,92,240,.12),0 18px 40px rgba(255,79,154,.12)}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.sub{color:var(--ink-soft);font-size:18px;margin:0}
.big-title{font-size:clamp(40px,9vw,78px);font-weight:800;color:var(--pink-deep);
  text-shadow:4px 4px 0 #fff,7px 7px 0 var(--lav)}
.big-title .hrt{color:var(--pink-mid)}
h2{font-size:clamp(28px,5vw,42px);color:var(--lav-deep);font-weight:800}
h3{font-size:24px;font-weight:800}

/* bubbly buttons */
.btn{border:0;border-radius:999px;padding:16px 28px;font-weight:700;font-size:21px;
  background:var(--pink-deep);color:#fff;box-shadow:0 6px 0 #c9337a;transition:transform .08s,box-shadow .08s;
  min-height:56px;text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9337a}
.btn.lav{background:var(--lav-deep);box-shadow:0 6px 0 #5f36bf}
.btn.lav:active{box-shadow:0 2px 0 #5f36bf}
.btn.blue{background:var(--blue-deep);box-shadow:0 6px 0 #1c69ac}
.btn.blue:active{box-shadow:0 2px 0 #1c69ac}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--lav)}
.btn.soft:active{box-shadow:0 2px 0 var(--lav)}
.btn.huge{font-size:clamp(24px,5vw,34px);padding:22px 44px;
  background:linear-gradient(90deg,#ff6fae,#ffb14f,#ffd84d,#6fd6a0,#6cb8ff,#a47bff);color:#fff;
  text-shadow:0 2px 0 rgba(74,53,96,.35);box-shadow:0 8px 0 #b44a8f;animation:bob 2.4s ease-in-out infinite}
.btn.huge:active{box-shadow:0 3px 0 #b44a8f}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- home ---------- */
.scene{width:100%;max-width:560px;margin:0 auto;display:block}
.sparkle-float{position:absolute;pointer-events:none;font-size:26px;animation:twinkle 3s ease-in-out infinite}
.home-wrap{position:relative;overflow:hidden}

/* ---------- setup ---------- */
.setup-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start}
.preview{background:linear-gradient(180deg,var(--blue),var(--lav));border-radius:28px;padding:14px;text-align:center;
  position:sticky;top:90px;border:4px solid #fff}
.preview svg{width:100%;max-width:240px;height:auto}
.preview .nm{font-family:var(--display);font-size:26px;font-weight:800;color:var(--ink);word-break:break-word}
.namebox{width:100%;font:inherit;font-size:24px;padding:14px 20px;border-radius:999px;border:4px solid var(--pink);
  background:#fff;color:var(--ink);font-weight:600}
.opt-group h3{font-size:20px;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.opt{border:4px solid transparent;background:#fff;border-radius:22px;padding:8px 6px;font-weight:600;font-size:15px;
  display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--lav);min-height:64px;justify-content:center}
.opt .ic{font-size:30px;line-height:1}
.opt svg{width:58px;height:66px}
.opt[aria-pressed="true"]{border-color:var(--pink-deep);background:#fff0f7;transform:scale(1.04)}
.swatch{width:100%;aspect-ratio:1;max-width:72px;border-radius:50%;border:5px solid #fff;box-shadow:0 4px 0 rgba(74,53,96,.18);justify-self:center}
.swatch[aria-pressed="true"]{outline:5px solid var(--ink);outline-offset:2px}
.opts.swatches{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}

/* duo */
.duo{display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,3vw,30px);flex-wrap:wrap}
.duo figure{margin:0;text-align:center}
.duo svg{width:clamp(120px,30vw,210px);height:auto}
.duo figcaption{font-family:var(--display);font-weight:800;font-size:24px}
.duo .mid{font-size:48px;align-self:center;animation:pulse 1.2s ease-in-out infinite}

/* ---------- hub ---------- */
.hub-meter{font-size:clamp(28px,6vw,44px);letter-spacing:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{border:0;border-radius:28px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 7px 0 rgba(74,53,96,.14);position:relative;transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.tile:active{transform:translateY(3px)}
.tile .ic{font-size:54px;line-height:1.1}
.tile .t{font-family:var(--display);font-weight:800;font-size:23px}
.tile .d{font-size:15px;color:var(--ink-soft)}
.tile .done{position:absolute;top:10px;right:12px;background:#fff;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;color:var(--pink-deep)}
.c1{background:var(--pink)}.c2{background:var(--lav)}.c3{background:var(--yellow)}.c4{background:var(--blue)}.c5{background:var(--mint)}.c6{background:#ffd9c7}

/* ---------- generic game bits ---------- */
.prompt-banner{background:var(--yellow);border-radius:24px;padding:16px 20px;font-family:var(--display);font-weight:800;
  font-size:clamp(24px,4.6vw,36px);text-align:center;border:4px dashed #fff;box-shadow:0 5px 0 var(--yellow-deep)}
.turn{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:700;font-size:22px;flex-wrap:wrap;text-align:center}
.mini{display:inline-block;width:52px;height:60px;flex:0 0 auto}
.mini svg{width:100%;height:100%}
.progress{font-weight:600;color:var(--ink-soft);text-align:center}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.choice{border:0;border-radius:24px;background:#fff;padding:16px 10px;font-weight:700;font-size:20px;
  box-shadow:0 6px 0 var(--lav);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;justify-content:center}
.choice .ic{font-size:42px;line-height:1}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lav)}
.choice.off{opacity:.35;pointer-events:none}
.choice.right{background:var(--mint);box-shadow:0 6px 0 var(--mint-deep)}
.handoff{background:linear-gradient(135deg,var(--lav),var(--blue));border-radius:28px;padding:28px 18px;text-align:center}
.handoff .ic{font-size:70px}

/* drawing */
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pad{background:#fff;border-radius:26px;padding:12px;border:4px solid var(--pink);display:flex;flex-direction:column;gap:10px}
.pad.p2{border-color:var(--blue)}
.pad-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.pad canvas{width:100%;aspect-ratio:5/4;background:#fff;border-radius:18px;border:3px dashed var(--lav);touch-action:none;display:block;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{width:36px;height:36px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px rgba(74,53,96,.2)}
.dot[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.tool{border:0;background:var(--lav);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px;min-height:38px}
.tool[aria-pressed="true"]{background:var(--lav-deep);color:#fff}
.reveal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.reveal-item{background:#fff;border-radius:26px;padding:12px;text-align:center;border:4px solid var(--yellow)}
.reveal-item img{width:100%;border-radius:16px;border:3px solid var(--lav);animation:popIn .6s ease both}
.award{display:inline-block;background:var(--yellow);border-radius:999px;padding:6px 14px;font-weight:700;margin:4px;animation:popIn .5s ease both}

/* quiz results */
.qres{display:flex;flex-direction:column;gap:10px}
.qrow{background:#fff;border-radius:22px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;animation:popIn .5s ease both}
.qrow .q{font-weight:700}
.qrow .a{background:var(--pink);border-radius:16px;padding:6px 10px;text-align:center;font-weight:600}
.qrow .a.b{background:var(--blue)}
.qrow .verdict{grid-column:1/-1;text-align:center;font-weight:700;color:var(--lav-deep)}
.qhead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px;font-weight:700;text-align:center;padding-inline:16px}

/* would you rather */
.wyr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.wyr .or{align-self:center;font-family:var(--display);font-weight:800;font-size:30px;color:var(--pink-deep)}
.bigchoice{border:0;border-radius:32px;padding:22px 12px;font-weight:700;font-size:clamp(20px,3.6vw,28px);
  display:flex;flex-direction:column;align-items:center;gap:8px;min-height:200px;justify-content:center;box-shadow:0 8px 0 rgba(74,53,96,.18)}
.bigchoice .ic{font-size:clamp(64px,12vw,96px);line-height:1}
.bigchoice.a{background:var(--pink)}.bigchoice.b{background:var(--blue)}
.bigchoice:active{transform:translateY(5px)}
.pickers{display:flex;gap:4px;justify-content:center;min-height:60px}

/* mystery */
.silo{font-size:clamp(110px,24vw,170px);line-height:1.1;text-align:center;transition:filter .6s}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{background:#fff;border-radius:18px;padding:10px 16px;font-weight:600;font-size:20px;animation:popIn .5s ease both;border-left:8px solid var(--lav-deep)}

/* puzzles */
.memgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:520px;margin:0 auto}
.mcard{aspect-ratio:1;border:0;border-radius:20px;font-size:clamp(30px,8vw,48px);background:var(--lav-deep);color:#fff;box-shadow:0 5px 0 #5f36bf}
.mcard.up{background:#fff;box-shadow:0 5px 0 var(--lav)}
.mcard.got{background:var(--mint);box-shadow:0 5px 0 var(--mint-deep)}
.pattern{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:clamp(36px,8vw,56px)}
.pattern span{background:#fff;border-radius:18px;padding:4px 10px;min-width:1.4em;text-align:center}
.pattern span.q{background:var(--yellow);font-family:var(--display);color:var(--pink-deep)}
.spot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#fff;padding:10px;border-radius:22px}
.scell{aspect-ratio:1;border:0;background:#fff7fb;border-radius:14px;font-size:clamp(22px,5vw,38px);position:relative;padding:0}
.scell.found{background:var(--mint);outline:4px solid var(--mint-deep)}
.matchcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:520px;margin:0 auto}
.matchcols .col{display:flex;flex-direction:column;gap:10px}
.mitem{border:0;border-radius:22px;background:#fff;font-size:44px;padding:8px;box-shadow:0 5px 0 var(--lav)}
.mitem.sel{background:var(--yellow);box-shadow:0 5px 0 var(--yellow-deep)}
.mitem.ok{background:var(--mint);box-shadow:0 5px 0 var(--mint-deep);pointer-events:none}
.wiggle{animation:wiggle .45s}
.ok-msg{background:var(--mint);border-radius:22px;padding:14px;text-align:center;font-weight:700;font-size:22px;animation:popIn .5s both}

/* card maker */
.maker{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.fcard{position:relative;aspect-ratio:4/3;width:100%;border-radius:26px;overflow:hidden;border:6px solid #fff;
  box-shadow:0 10px 24px rgba(138,92,240,.25);touch-action:none;user-select:none}
.fcard .msg{position:absolute;left:12%;right:12%;top:30%;bottom:26%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,.78);border-radius:24px;padding:10px;text-align:center}
.fcard .msg .m{font-family:var(--display);font-weight:800;font-size:clamp(18px,3.4vw,30px);line-height:1.15;word-break:break-word;color:var(--ink)}
.fcard .msg .f{font-size:clamp(12px,1.8vw,16px);font-weight:600;color:var(--ink-soft);margin-top:6px}
.stk{position:absolute;font-family:var(--emoji);line-height:1;cursor:grab;transform:translate(-50%,-50%);touch-action:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.stkbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.stkbtns button{border:0;background:#fff;border-radius:16px;font-size:30px;padding:6px;box-shadow:0 4px 0 var(--lav)}
.bgbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.bgbtns button{aspect-ratio:4/3;border-radius:14px;border:4px solid #fff;box-shadow:0 3px 0 rgba(74,53,96,.2)}
.bgbtns button[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;background:var(--yellow);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:600}
.album{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.album img{height:96px;border-radius:12px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.12)}

/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(74,53,96,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:620px;width:100%;max-height:92vh;overflow:auto}
.modal img{width:100%;border-radius:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;border-radius:999px;
  padding:14px 26px;font-weight:700;font-size:20px;box-shadow:0 8px 24px rgba(255,79,154,.35);z-index:60;animation:toastIn .4s both;
  border:4px solid var(--pink);max-width:calc(100% - 32px);text-align:center}

/* finale */
.badge svg{width:min(320px,80vw);height:auto;animation:popIn .8s both}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}

/* friend's favourites */
.faves-tile{background:
  radial-gradient(circle at 20% 25%,rgba(255,79,154,.18) 6px,transparent 7px),
  radial-gradient(circle at 70% 75%,rgba(31,174,120,.18) 6px,transparent 7px),#ffe0ec;background-size:40px 40px;
  border:4px dashed #fff!important;grid-column:1/-1}
.faves-wrap{background:
  radial-gradient(circle at 14px 14px,rgba(255,79,154,.16) 4px,transparent 5px),
  radial-gradient(circle at 34px 34px,rgba(121,220,176,.25) 4px,transparent 5px),#fff5f9;
  background-size:40px 40px}
.berry-border{display:flex;justify-content:center;gap:6px;font-size:26px;flex-wrap:wrap}
.faves-hero{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.faves-hero svg{width:clamp(64px,14vw,96px);height:auto;animation:bob 2.6s ease-in-out infinite}
.faves-hero svg:last-child{animation-delay:.6s}
.popstar-title{font-family:var(--display);font-weight:800;font-size:clamp(26px,5.4vw,42px);text-align:center;
  background:linear-gradient(90deg,#ff4f9a,#b05cf0,#2f8fe0,#ff4f9a);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% 100%;animation:shine 4s linear infinite}
.stagecard{border-radius:28px;padding:18px 14px;text-align:center;color:#fff;position:relative;overflow:hidden;border:5px solid #fff;
  box-shadow:0 8px 0 rgba(74,53,96,.2)}
.stagecard::before{content:"";position:absolute;inset:-40% 20% auto;height:90%;background:radial-gradient(ellipse at top,rgba(255,255,255,.55),transparent 70%);pointer-events:none}
.stagecard h3{font-size:26px;text-shadow:0 2px 0 rgba(74,53,96,.4);position:relative}
.stagecard .mini{width:110px;height:126px}
.stagecard ul{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px;position:relative}
.stagecard li{background:rgba(255,255,255,.88);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:600}
.bracelet{display:flex;justify-content:center;align-items:center;gap:4px;padding:8px 14px;background:rgba(255,255,255,.88);border-radius:999px;
  border:3px dotted var(--pink-deep);font-size:26px;position:relative;flex-wrap:wrap}
.bead{width:12px;height:12px;border-radius:50%;background:var(--pink-mid);display:inline-block}
.bead:nth-child(4n+2){background:var(--lav-deep)}.bead:nth-child(4n+3){background:var(--yellow-deep)}
.opt.multi[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:10px;font-weight:800;color:var(--pink-deep)}
.opt.multi{position:relative}
.bandname{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,36px);color:var(--pink-deep)}
.songtitle{background:#fff;border-radius:26px;padding:18px;text-align:center;border:4px solid var(--pink);font-family:var(--display);font-weight:800;
  font-size:clamp(24px,5vw,38px);color:var(--lav-deep)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip-row button{border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:18px;background:#fff;box-shadow:0 4px 0 var(--pink)}
.chip-row button[aria-pressed="true"]{background:var(--pink-deep);color:#fff;box-shadow:0 4px 0 #c9337a}
@keyframes shine{to{background-position:200% 0}}

/* animations */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.8)}100%{transform:scale(1)}}

<main id="app"></main>

<script>
/* =========================================================
   BESTIE BUDDIES — the ultimate playdate
   ========================================================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------------- SOUND (gentle Web Audio blips) ---------------- */
let soundOn = true, actx = null;
function ac(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, dur, type, when, vol, slide){
  const c = ac(); if (!c || !soundOn) return;
  const t = c.currentTime + (when || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .1, t + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  click(){ tone(700, .07, 'triangle', 0, .07); },
  sparkle(){ [1318,1568,2093,2637].forEach((f,i)=>tone(f,.18,'triangle',i*.06,.05)); },
  heart(){ tone(420,.16,'sine',0,.14,980); tone(1300,.12,'triangle',.12,.05); },
  party(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.1,.08)); [523,659,784].forEach(f=>tone(f,.7,'sine',.45,.06)); },
  oops(){ tone(392,.18,'sine',0,.07,300); }
};
document.addEventListener('click', e => { if (e.target.closest('button')) SFX.click(); }, true);
$('#soundBtn').onclick = () => {
  soundOn = !soundOn;
  $('#soundBtn').innerHTML = soundOn ? '🔊<span class="hide-sm"> Sound ON</span>' : '🔇<span class="hide-sm"> Sound OFF</span>'; $('#soundBtn').setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
  $('#soundBtn').setAttribute('aria-pressed', soundOn);
  if (soundOn) SFX.sparkle();
};

/* ---------------- CHARACTERS (SVG) ---------------- */
const INK = '#4a3560';
const ANIMALS = {
  bunny:  {label:'Bunny',   fur:'#fff6fa', ear:'#fff6fa', inner:'#ffb3d1'},
  kitty:  {label:'Kitty',   fur:'#ffd9a8', ear:'#ffd9a8', inner:'#ffb3c7'},
  bear:   {label:'Teddy',   fur:'#dcae84', ear:'#dcae84', inner:'#f3d3b4'},
  puppy:  {label:'Puppy',   fur:'#f6e6cf', ear:'#b98a62', inner:'#b98a62'},
  unicorn:{label:'Unicorn', fur:'#f7f1ff', ear:'#f7f1ff', inner:'#ffc4e0'},
  panda:  {label:'Panda',   fur:'#ffffff', ear:'#4a3f55', inner:'#4a3f55'}
};
const OUTFITS = {dress:{label:'Dress',ic:'👗'}, hoodie:{label:'Hoodie',ic:'🧥'}, overalls:{label:'Overalls',ic:'👖'}, tutu:{label:'Tutu',ic:'🩰'}};
const COLOURS = {pink:'#ff8fc1', lavender:'#b89cff', blue:'#7cc7ff', yellow:'#ffd84d', mint:'#79dcb0', peach:'#ffa987'};
const ACCS = {bow:{label:'Bow',ic:'🎀'}, crown:{label:'Crown',ic:'👑'}, flower:{label:'Flower',ic:'🌸'}, glasses:{label:'Glasses',ic:'👓'}, star:{label:'Star clip',ic:'⭐'}, heart:{label:'Heart clip',ic:'💖'}};

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v*(1+amt) : v + (255-v)*amt)));
  return '#' + [f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function starPath(cx, cy, R, r){
  let d=''; for (let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rad=i%2?r:R; d+=(i?'L':'M')+(cx+Math.cos(a)*rad).toFixed(1)+' '+(cy+Math.sin(a)*rad).toFixed(1); } return d+'Z';
}
const HEART = (x,y,s,fill) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 6 C0 -2 -12 -4 -12 4 C-12 12 0 18 0 22 C0 18 12 12 12 4 C12 -4 0 -2 0 6Z" fill="${fill}" stroke="${INK}" stroke-width="${2.5/s}" stroke-linejoin="round"/>`;

function charG(p){
  const A = ANIMALS[p.animal] || ANIMALS.bunny, c = COLOURS[p.color] || COLOURS.pink, dc = shade(c,-.18), lc = shade(c,.45);
  const S = `stroke="${INK}" stroke-width="4" stroke-linejoin="round"`;
  let g = '';
  // legs + body
  g += `<ellipse cx="84" cy="228" rx="16" ry="10" fill="${A.fur}" ${S}/><ellipse cx="116" cy="228" rx="16" ry="10" fill="${A.fur}" ${S}/>`;
  if (p.outfit === 'dress') g += `<path d="M78 150 Q100 142 122 150 L150 222 Q100 234 50 222 Z" fill="${c}" ${S}/><path d="M86 150 Q100 164 114 150" fill="#fff" ${S}/>${HEART(100,180,.8,lc)}`;
  else if (p.outfit === 'hoodie') g += `<rect x="62" y="146" width="76" height="82" rx="30" fill="${c}" ${S}/><path d="M78 196 h44 v10 q-22 10 -44 0z" fill="${dc}" stroke="${INK}" stroke-width="3"/><path d="M92 152 v18 M108 152 v18" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  else if (p.outfit === 'overalls') g += `<rect x="64" y="146" width="72" height="80" rx="28" fill="#fff" ${S}/><path d="M74 172 h52 v28 q0 24 -26 24 q-26 0 -26 -24 z" fill="${c}" ${S}/><path d="M80 172 L72 150 M120 172 L128 150" stroke="${dc}" stroke-width="6" stroke-linecap="round"/><circle cx="82" cy="180" r="3.5" fill="${INK}"/><circle cx="118" cy="180" r="3.5" fill="${INK}"/>`;
  else g += `<rect x="70" y="146" width="60" height="56" rx="24" fill="${c}" ${S}/><path d="M48 202 L58 188 L68 200 L78 186 L88 200 L100 186 L112 200 L122 186 L132 200 L142 188 L152 202 L140 222 Q100 232 60 222 Z" fill="${lc}" ${S}/>${starPath ? `<path d="${starPath(100,168,9,4)}" fill="#fff"/>` : ''}`;
  g += `<circle cx="56" cy="182" r="14" fill="${A.fur}" ${S}/><circle cx="144" cy="182" r="14" fill="${A.fur}" ${S}/>`;
  // unicorn mane behind head
  if (p.animal === 'unicorn') g += `<circle cx="58" cy="70" r="14" fill="#ffb3d1" ${S}/><circle cx="50" cy="94" r="14" fill="#c9b3ff" ${S}/><circle cx="54" cy="118" r="13" fill="#a8dcff" ${S}/>`;
  // back ears
  const ears = {
    bunny: `<ellipse cx="74" cy="38" rx="15" ry="36" fill="${A.ear}" ${S} transform="rotate(-10 74 38)"/><ellipse cx="74" cy="42" rx="7" ry="24" fill="${A.inner}" transform="rotate(-10 74 42)"/><ellipse cx="126" cy="38" rx="15" ry="36" fill="${A.ear}" ${S} transform="rotate(10 126 38)"/><ellipse cx="126" cy="42" rx="7" ry="24" fill="${A.inner}" transform="rotate(10 126 42)"/>`,
    kitty: `<path d="M52 74 L58 22 L94 50 Z" fill="${A.ear}" ${S}/><path d="M61 62 L64 36 L83 51 Z" fill="${A.inner}"/><path d="M148 74 L142 22 L106 50 Z" fill="${A.ear}" ${S}/><path d="M139 62 L136 36 L117 51 Z" fill="${A.inner}"/>`,
    bear: `<circle cx="56" cy="52" r="20" fill="${A.ear}" ${S}/><circle cx="56" cy="52" r="10" fill="${A.inner}"/><circle cx="144" cy="52" r="20" fill="${A.ear}" ${S}/><circle cx="144" cy="52" r="10" fill="${A.inner}"/>`,
    panda: `<circle cx="56" cy="52" r="20" fill="${A.ear}" ${S}/><circle cx="144" cy="52" r="20" fill="${A.ear}" ${S}/>`,
    unicorn: `<path d="M60 66 L64 34 L88 52 Z" fill="${A.ear}" ${S}/><path d="M140 66 L136 34 L112 52 Z" fill="${A.ear}" ${S}/>`,
    puppy: ''
  };
  g += ears[p.animal] || '';
  // head
  g += `<circle cx="100" cy="98" r="56" fill="${A.fur}" ${S}/>`;
  if (p.animal === 'puppy') g += `<ellipse cx="48" cy="98" rx="16" ry="34" fill="${A.ear}" ${S} transform="rotate(18 48 98)"/><ellipse cx="152" cy="98" rx="16" ry="34" fill="${A.ear}" ${S} transform="rotate(-18 152 98)"/>`;
  if (p.animal === 'panda') g += `<ellipse cx="79" cy="102" rx="15" ry="18" fill="${A.ear}" transform="rotate(20 79 102)"/><ellipse cx="121" cy="102" rx="15" ry="18" fill="${A.ear}" transform="rotate(-20 121 102)"/>`;
  if (p.animal === 'bear' || p.animal === 'puppy') g += `<ellipse cx="100" cy="120" rx="21" ry="15" fill="${shade(A.fur,.45)}"/>`;
  // eyes
  if (p.animal === 'panda') g += `<circle cx="80" cy="102" r="8" fill="#fff"/><circle cx="81" cy="103" r="5" fill="${INK}"/><circle cx="120" cy="102" r="8" fill="#fff"/><circle cx="119" cy="103" r="5" fill="${INK}"/>`;
  else g += `<ellipse cx="80" cy="102" rx="7.5" ry="9.5" fill="${INK}"/><circle cx="82.5" cy="98" r="3" fill="#fff"/><ellipse cx="120" cy="102" rx="7.5" ry="9.5" fill="${INK}"/><circle cx="122.5" cy="98" r="3" fill="#fff"/>`;
  g += `<ellipse cx="66" cy="121" rx="10" ry="6" fill="#ff9ebf" opacity=".75"/><ellipse cx="134" cy="121" rx="10" ry="6" fill="#ff9ebf" opacity=".75"/>`;
  // nose & mouth
  if (['bear','puppy','panda'].includes(p.animal)) g += `<ellipse cx="100" cy="114" rx="7" ry="5" fill="${INK}"/>`;
  else g += `<path d="M94 112 Q100 119 106 112 Z" fill="#ff6fa3" stroke="${INK}" stroke-width="2"/>`;
  g += `<path d="M90 124 Q100 134 110 124" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
  if (p.animal === 'kitty') g += `<path d="M44 108 L66 112 M44 120 L66 118 M156 108 L134 112 M156 120 L134 118" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
  // accessory
  const acc = {
    bow: `<g transform="translate(140 52) rotate(18)"><path d="M0 0 L-22 -14 Q-29 0 -22 14 Z" fill="#ff4f9a" ${S}/><path d="M0 0 L22 -14 Q29 0 22 14 Z" fill="#ff4f9a" ${S}/><circle r="7" fill="#ff8fc1" ${S}/></g>`,
    crown: `<g transform="translate(100 44)"><path d="M-26 8 L-28 -16 L-13 -4 L0 -24 L13 -4 L28 -16 L26 8 Z" fill="#ffd84d" ${S}/><circle cx="0" cy="-1" r="4.5" fill="#ff4f9a"/><circle cx="-16" cy="2" r="3" fill="#7cc7ff"/><circle cx="16" cy="2" r="3" fill="#7cc7ff"/></g>`,
    flower: `<g transform="translate(60 58)">${[0,72,144,216,288].map(a=>`<circle cx="${(Math.cos(a*Math.PI/180)*10).toFixed(1)}" cy="${(Math.sin(a*Math.PI/180)*10).toFixed(1)}" r="8" fill="#ffc8dd" stroke="${INK}" stroke-width="2.5"/>`).join('')}<circle r="6" fill="#ffd84d" stroke="${INK}" stroke-width="2.5"/></g>`,
    glasses: `<g fill="rgba(255,255,255,.3)" stroke="#ff4f9a" stroke-width="4.5"><circle cx="80" cy="102" r="15"/><circle cx="120" cy="102" r="15"/><path d="M95 100 Q100 95 105 100" fill="none"/></g>`,
    star: `<path d="${starPath(138,56,15,7)}" fill="#ffd84d" ${S}/>`,
    heart: HEART(62,44,1,'#ff4f9a')
  };
  g += acc[p.acc] || '';
  if (p.animal === 'unicorn') g += `<path d="M100 4 L88 46 L112 46 Z" fill="#ffd84d" ${S}/><path d="M92 32 L108 26 M90 40 L110 36 M95 20 L105 16" stroke="${INK}" stroke-width="2.5"/>`;
  return g;
}
const charSVG = (p, label) => `<svg viewBox="0 0 200 240" role="img" aria-label="${esc(label || 'Bestie character')}">${charG(p)}</svg>`;
const mini = i => `<span class="mini">${charSVG(state.players[i], state.players[i].name)}</span>`;

/* ---------------- STATE ---------------- */
const ACTIVITIES = [
  {id:'draw',   ic:'🎨', t:'Mystery Drawing', d:'Draw something super silly!', c:'c1'},
  {id:'quiz',   ic:'🧠', t:'Bestie Quiz',     d:'Secret answers — do you match?', c:'c2'},
  {id:'wyr',    ic:'🤪', t:'Would You Rather?', d:'Pick one… if you dare!', c:'c3'},
  {id:'mystery',ic:'🎁', t:'Mystery Object',  d:'Guess it from 3 clues', c:'c4'},
  {id:'puzzle', ic:'🧩', t:'Mini Puzzles',    d:'Solve them together', c:'c5'},
  {id:'card',   ic:'💌', t:'Friendship Card', d:'Make a card for each other', c:'c6'},
  {id:'faves',  ic:'🍓', t:"Friend's Favourites", d:'Pop stars, strawberries & cucumbers!', c:'faves-tile'}
];
const DEFAULTS = [
  {name:'', animal:'bunny', outfit:'dress', color:'pink', acc:'bow'},
  {name:'', animal:'kitty', outfit:'hoodie', color:'blue', acc:'crown'}
];
let state = { players: JSON.parse(JSON.stringify(DEFAULTS)), done: [], ready: false };
const pname = i => state.players[i].name || ('Bestie ' + (i+1));

function renderMeter(popIdx){
  const n = ACTIVITIES.length;
  let h = '<span class="lbl">Friendship</span>';
  for (let i=0;i<n;i++) h += `<span class="h emo${i===popIdx?' pop':''}">${i < state.done.length ? '💗' : '🤍'}</span>`;
  $('#meter').innerHTML = h;
  $('#meter').setAttribute('aria-label', `Friendship meter: ${state.done.length} of ${n} hearts`);
}
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
function earnHeart(id){
  if (state.done.includes(id)) return false;
  state.done.push(id); SFX.heart(); renderMeter(state.done.length-1);
  toast('💗 +1 Friendship Heart! 💗'); return true;
}
$('#homeBtn').onclick = () => state.ready ? goHub() : goHome();

function show(html){ app.innerHTML = `<div class="screen">${html}</div>`; window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------------- HOME ---------------- */
function homeScene(){
  const pillow = (x,y,w,h,r,fill) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="${fill}" stroke="${INK}" stroke-width="4" transform="rotate(${r} ${x+w/2} ${y+h/2})"/>`;
  const popcorn = [[-22,-8],[-8,-16],[8,-14],[22,-6],[-14,0],[2,-4],[16,2],[-4,-24],[12,-26]].map(([x,y])=>`<circle cx="${260+x}" cy="${238+y}" r="9" fill="#fffbe8" stroke="${INK}" stroke-width="2.5"/>`).join('');
  const crayons = ['#ff4f9a','#ffd84d','#7cc7ff','#79dcb0'].map((c,i)=>`<g transform="translate(${452+i*13} 248) rotate(${-12+i*8})"><rect x="-5" y="-30" width="10" height="36" rx="3" fill="${c}" stroke="${INK}" stroke-width="2.5"/><path d="M-5 -30 L0 -40 L5 -30Z" fill="${c}" stroke="${INK}" stroke-width="2.5"/></g>`).join('');

    ${popcorn}
    <path d="M232 248 L288 248" stroke="#fff" stroke-width="4" stroke-dasharray="8 7"/>
    <g transform="translate(40 262)"><path d="M-14 0 L14 0 L10 18 L-10 18Z" fill="#7cc7ff" stroke="${INK}" stroke-width="3"/><path d="M-16 0 Q-16 -18 0 -18 Q16 -18 16 0Z" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="0" cy="-22" r="5" fill="#ff4f9a" stroke="${INK}" stroke-width="2.5"/></g>
    ${crayons}
    <text x="200" y="50" font-size="26" class="emo">✨</text><text x="300" y="30" font-size="22" class="emo">⭐</text><text x="250" y="80" font-size="24" class="emo">💕</text>
  </svg>`;
}
function goHome(){

/* ---------------- SETUP ---------------- */
function goSetup(i){
  const p = state.players[i];
  const optBtns = (group, entries, render) => entries.map(([k,v]) => `<button class="opt" type="button" data-g="${group}" data-v="${k}" aria-pressed="${p[group]===k}">${render(k,v)}</button>`).join('');
  show(`<div class="card stack">
    <h2 class="center">Player ${i+1}: What's your name? 💕</h2>
    <div class="setup-grid">
      <div class="preview"><div id="pv"></div><div class="nm" id="pvName"></div></div>

function setupPad(i){
  const canvas = $('#cv'+i), ctx = canvas.getContext('2d');
  const st = {color:PAINTS[1], size:11, eraser:false, drawing:false, last:null};
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pos = e => { const r = canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*canvas.width/r.width, y:(e.clientY-r.top)*canvas.height/r.height}; };
  const dot = pt => { ctx.beginPath(); ctx.fillStyle = st.eraser ? '#fff' : st.color; ctx.arc(pt.x, pt.y, (st.eraser?st.size*2:st.size)/2, 0, Math.PI*2); ctx.fill(); };
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); st.drawing = true; st.last = pos(e); dot(st.last); });
  canvas.addEventListener('pointermove', e => {
    if (!st.drawing) return; const pt = pos(e);
    ctx.strokeStyle = st.eraser ? '#fff' : st.color; ctx.lineWidth = st.eraser ? st.size*2 : st.size;
    ctx.beginPath(); ctx.moveTo(st.last.x, st.last.y); ctx.lineTo(pt.x, pt.y); ctx.stroke(); st.last = pt;
  });
  const end = () => { st.drawing = false; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end); canvas.addEventListener('pointerleave', end);
  app.querySelectorAll(`[data-p="${i}"]`).forEach(b => b.onclick = () => {
    if (b.dataset.c) { st.color = b.dataset.c; st.eraser = false; app.querySelectorAll(`[data-p="${i}"][data-c]`).forEach(x=>x.setAttribute('aria-pressed', x===b)); app.querySelector(`[data-p="${i}"][data-er]`).setAttribute('aria-pressed', false); }
    else if (b.dataset.s) { st.size = +b.dataset.s; app.querySelectorAll(`[data-p="${i}"][data-s]`).forEach(x=>x.setAttribute('aria-pressed', x===b)); }
    else if (b.hasAttribute('data-er')) { st.eraser = !st.eraser; b.setAttribute('aria-pressed', st.eraser); }
    else if (b.hasAttribute('data-clear')) { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  });
  return {canvas};
}

function pzMemory(){

function wrapText(ctx, text, maxW){

  if (line) lines.push(line); return lines;
}

  ctx.font = `800 64px Sniglet, Fredoka, ${getComputedStyle(document.body).fontFamily}`;
  const lines = wrapText(ctx, card.msg || '💕', pw - 80).slice(0,3);
  lines.forEach((l,i) => ctx.fillText(l, W/2, py + ph/2 - 30 - (lines.length-1)*36 + i*72));
  ctx.font = '600 32px Fredoka, sans-serif'; ctx.fillStyle = '#7c6893';
  ctx.fillText(`From ${pname(0)} & ${pname(1)} 💕`, W/2, py + ph - 50);
  // stickers
  const base = Math.min(52, Math.max(28, window.innerWidth*.06)) * (W / $('#fcard').clientWidth);
  card.stickers.forEach(s => {
    ctx.save(); ctx.translate(s.x/100*W, s.y/100*H); ctx.rotate(s.r*Math.PI/180);
    ctx.font = `${Math.round(base*s.s)}px ${'Apple Color Emoji'}, 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif`;
    ctx.fillText(s.e, 0, 0); ctx.restore();
  });
  // border
  ctx.lineWidth = 24; ctx.strokeStyle = '#fff'; ctx.strokeRect(12,12,W-24,H-24);
  return cv;
}
async function saveCard(){
  const cv = await renderCardPNG();

  document.body.appendChild(m);

let confettiRAF = null;
function confetti(ms, big){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'); cv.hidden = false;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ['#ff4f9a','#ff8fc1','#b89cff','#7cc7ff','#ffd84d','#79dcb0','#ffa987'];
  const shapes = ['rect','circle','heart','star'];
  const N = big ? 220 : 120;
  const parts = Array.from({length:N}, () => ({x:Math.random()*innerWidth, y:-20 - Math.random()*innerHeight*.6, vx:-1.5+Math.random()*3, vy:2+Math.random()*3.5,
    r:Math.random()*6, vr:-.1+Math.random()*.2, s:6+Math.random()*9, c:pick(cols), sh:pick(shapes)}));
  const start = performance.now();
  cancelAnimationFrame(confettiRAF);
  const frame = now => {
    const t = now - start; ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p => {
      p.x += p.vx + Math.sin((t/400)+p.s); p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - ms) / 900);
      if (p.sh === 'rect') ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      else if (p.sh === 'circle') { ctx.beginPath(); ctx.arc(0,0,p.s/2.5,0,7); ctx.fill(); }
      else if (p.sh === 'heart') { const k=p.s/22; ctx.scale(k,k); ctx.fill(new Path2D('M0 6 C0 -2 -12 -4 -12 4 C-12 12 0 18 0 22 C0 18 12 12 12 4 C12 -4 0 -2 0 6Z')); }
      else { ctx.fill(new Path2D(starPath(0,0,p.s/1.6,p.s/3.2))); }
      ctx.restore();
    });
    if (t < ms + 900) confettiRAF = requestAnimationFrame(frame); else { ctx.clearRect(0,0,innerWidth,innerHeight); cv.hidden = true; }
  };
  confettiRAF = requestAnimationFrame(frame);
}

/* ---------------- BOOT (keeps players & hearts across live updates) ---------------- */
function start(saved){
  if (saved && saved.players) { state = saved; (saved.puz || []).forEach(p => puzDone.add(p)); }
  renderMeter();
  state.ready ? goHub() : goHome();
}
try { window.claude?.hot?.snapshot?.(() => ({...state, puz:[...puzDone]})); } catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
